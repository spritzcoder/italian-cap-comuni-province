name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Audit all dependencies, including development tools
        run: npm run audit
      - name: Verify data and public API
        run: |
          npm run data:verify
          npm test
          npm run type-check
          npm run lint
      - name: Verify builds and installed package consumers
        run: |
          npm run build
          npm run test:build
          npm run test:package
          git diff --check
